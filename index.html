<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de estoque - POO - v4</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="moldura-mar">
            <img src="belle.jpg" alt="Minha foto" class="foto-mar">
        </div>

        <h1>Cadastro de Produtos V4</h1>

        <form id="produto-form">

            <div class="form-group campo-nome-container">
                <label for="nome">Nome do produto:</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Ex. Notebook"
                    autocomplete="off"
                    required
                >

                <!-- NOVO: SUGESTÕES DE PRODUTOS -->
                <div id="sugestoes-produtos" class="sugestoes-produtos"></div>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    placeholder="Ex. 3500.00"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    placeholder="Ex. 5"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Adicionar ao carrinho
            </button>

        </form>

        <div class="resumo-container">
            <h3 id="total-estoque">Total em estoque R$ 0.00</h3>

            <button id="limpar-tabela" class="btn-danger">
                Limpar tudo
            </button>
        </div>

        <div class="form-group busca-container">
            <label for="campo-busca">Pesquisar produto:</label>

            <input
                type="text"
                id="campo-busca"
                placeholder="Digite o nome do produto..."
            >
        </div>

        <table id="tabela-produtos">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço-un</th>
                    <th>Quant.</th>
                    <th>Sub-total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <!-- As linhas da tabela vão ser inseridas pelo JS -->
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
